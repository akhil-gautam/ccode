name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release or retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate version tag
        run: |
          python3 scripts/release.py version "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app
      - name: Ensure Metal toolchain
        run: xcrun metal -v || xcodebuild -downloadComponent MetalToolchain
      - name: Test release packaging
        run: python3 scripts/test-release.py
      - name: Test native app
        run: sh scripts/swift-check.sh test --build-system native
      - name: Build signed archive
        run: python3 scripts/release.py build "$RELEASE_TAG" "$RELEASE_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccode-${{ matrix.arch }}
          path: |
            dist/ccode-*.zip
            dist/ccode-*.zip.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ccode-*
          path: dist
          merge-multiple: true
      - name: Publish release and update tap
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release.py version "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"] is False'; then
              # Keep published downloads immutable on a failed tap-update retry.
              rm -f dist/ccode-*.zip dist/ccode-*.zip.sha256
              gh release download "$RELEASE_TAG" --dir dist --pattern 'ccode-*.zip*'
            else
              gh release upload "$RELEASE_TAG" dist/ccode-*.zip dist/ccode-*.zip.sha256 --clobber
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "ccode $RELEASE_TAG" --notes 'Native macOS builds for Apple Silicon and Intel. Ad hoc signed; not notarized. See the README for agent setup and Homebrew installation.'
            gh release upload "$RELEASE_TAG" dist/ccode-*.zip dist/ccode-*.zip.sha256
          fi
          (cd dist && shasum -a 256 -c ./*.zip.sha256)
          python3 scripts/release.py cask "$RELEASE_TAG" dist Casks/ccode.rb
          gh release edit "$RELEASE_TAG" --draft=false
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/ccode.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Homebrew cask for $RELEASE_TAG"
            git push origin HEAD:main
          fi
